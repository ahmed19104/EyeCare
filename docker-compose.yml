
services:
  redis:
    image: redis:7-alpine
    container_name: eyecare-redis
    ports:
      - "6379:6379"
    volumes:
      - eyecare-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eyecare-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=MyProject;User ID=EyeCareApp;Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=True;"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  eyecare-redis-data:
