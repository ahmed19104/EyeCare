services:
  redis:
    image: redis:7-alpine
    container_name: eyecare-redis
    volumes:
      - eyecare-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      default:
        aliases:
          - redis

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: eyecare-jaeger
    ports:
    - "127.0.0.1:16686:16686"
    restart: unless-stopped
    networks:
      default:
        aliases:
          - jaeger

  api:
    image: eyecare-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eyecare-api
    ports:
     - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      DataProtection__KeysPath: /app/keys
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=MyProject;User ID=EyeCareApp;Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=True;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "${JWT_KEY}"
      OpenTelemetry__OtlpEndpoint: "http://jaeger:4317"
    volumes:
      - eyecare-dp-keys:/app/keys
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: eyecare-nginx
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/localhost.pem:/etc/nginx/certs/localhost.pem:ro
      - ./certs/localhost-key.pem:/etc/nginx/certs/localhost-key.pem:ro
    depends_on:
      - api
    networks:
      default:
        ipv4_address: 172.19.0.10
    restart: unless-stopped

volumes:
  eyecare-redis-data:
  eyecare-dp-keys:
  
      
networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16